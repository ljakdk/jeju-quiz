<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리나라 방언 퀴즈</title>
<style>
  :root { --accent:#4263eb; --accent-d:#3b5bdb; --accent2:#7048e8; --bg1:#fff4e6; --bg2:#e7f5ff;
    --paper:#fff; --ink:#2b2b2b; --head:#263238; --gray:#7d868f; --line:#ececec; --shadow:0 10px 40px rgba(30,40,50,.13); }
  :root[data-theme="dark"]{ --paper:#232a33; --ink:#e6e9ee; --head:#e8eef2; --gray:#9aa6b2; --line:#3a434e; --shadow:0 10px 40px rgba(0,0,0,.5); }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);min-height:100vh;padding:40px 18px 60px;display:flex;flex-direction:column;align-items:center;line-height:1.6;}
  :root[data-theme="dark"] body{background:linear-gradient(160deg,#10151b,#0c1013);}
  .wrap{width:100%;max-width:720px;}
  .theme-btn{position:fixed;top:16px;right:16px;z-index:10;width:46px;height:46px;border-radius:50%;background:var(--paper);border:2px solid var(--line);box-shadow:var(--shadow);font-size:20px;cursor:pointer;display:grid;place-items:center;transition:transform .12s;}
  .theme-btn:hover{transform:translateY(-2px) scale(1.05);}
  header{text-align:center;margin-bottom:22px;}
  header .flags{font-size:42px;letter-spacing:4px;}
  header h1{font-size:31px;color:var(--head);margin-top:8px;letter-spacing:-.5px;}
  header p{color:var(--gray);margin-top:10px;font-size:15px;word-break:keep-all;}
  .btn{display:block;width:100%;padding:15px;font-size:17px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-d));border:none;border-radius:14px;cursor:pointer;font-family:inherit;box-shadow:0 8px 20px rgba(0,0,0,.16);transition:transform .12s;margin-top:12px;}
  .btn:hover{transform:translateY(-2px);}
  .btn.ghost{background:var(--paper);color:var(--head);border:2px solid var(--line);box-shadow:none;}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px;}
  .room-banner{background:var(--paper);border:1px solid var(--line);border-left:8px solid var(--accent);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:18px;text-align:center;}
  .room-banner b{color:var(--head);} .room-banner .code{color:var(--accent);font-weight:900;letter-spacing:1px;}
  .room-banner .sub{color:var(--gray);font-size:13.5px;margin-top:4px;}
  .field{margin-top:14px;text-align:left;} .field label{font-weight:700;font-size:14.5px;color:var(--head);display:block;margin-bottom:8px;}
  .field .tag{font-weight:600;font-size:12px;color:var(--gray);}
  .field input{width:100%;padding:13px 15px;font-size:15px;font-family:inherit;border:2px solid var(--line);border-radius:12px;outline:none;background:var(--paper);color:var(--ink);}
  :root[data-theme="dark"] .field input{background:#1b212a;}
  .field input:focus{border-color:var(--accent);}
  .status{font-size:13.5px;font-weight:700;margin-top:12px;color:var(--accent2);word-break:keep-all;} .status:empty{display:none;} .status.warn{color:#e03131;}
  .made{text-align:center;font-weight:800;color:#2f9e44;margin:4px 0 6px;}
  .code-big{text-align:center;font-size:34px;font-weight:900;color:var(--head);letter-spacing:3px;margin:6px 0 14px;}
  .qr{display:block;margin:0 auto 12px;border-radius:12px;background:#fff;width:220px;height:220px;max-width:100%;}
  .linkbox{display:flex;gap:8px;} .linkbox input{flex:1;min-width:0;padding:11px 13px;font-size:13px;border:2px solid var(--line);border-radius:12px;font-family:inherit;background:#fafafa;color:var(--ink);}
  :root[data-theme="dark"] .linkbox input{background:#1b212a;}
  .linkbox .btn{width:auto;margin-top:0;padding:11px 15px;font-size:14px;white-space:nowrap;}
  .sec-title{font-weight:800;color:var(--head);font-size:16px;margin:6px 0 12px;text-align:center;}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;}
  @media(max-width:560px){.grid{grid-template-columns:1fr;}header h1{font-size:26px;}}
  .region{display:block;text-decoration:none;color:inherit;background:var(--paper);border:1px solid var(--line);border-left:8px solid var(--c);border-radius:18px;padding:18px 18px 16px;box-shadow:var(--shadow);transition:transform .14s;}
  .region:hover{transform:translateY(-4px);}
  .region .top{display:flex;align-items:center;gap:12px;}
  .region .emoji{font-size:32px;} .region .name{font-size:20px;font-weight:900;color:var(--head);}
  .region .badge{margin-left:auto;font-size:12px;font-weight:800;color:#fff;background:var(--c);border-radius:99px;padding:4px 10px;}
  .region .desc{margin-top:10px;font-size:13.5px;color:var(--gray);word-break:keep-all;}
  .region .go{margin-top:12px;font-weight:800;font-size:14px;color:var(--c);}
  footer{text-align:center;color:var(--gray);font-size:13px;margin-top:26px;line-height:1.7;word-break:keep-all;}
  .hidden{display:none;}
  .namewrap{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap;}
  .namewrap label{font-weight:700;font-size:14px;color:var(--head);}
  .namewrap input{width:170px;padding:9px 12px;font-size:15px;border:2px solid var(--line);border-radius:10px;font-family:inherit;background:var(--paper);color:var(--ink);outline:none;}
  :root[data-theme="dark"] .namewrap input{background:#1b212a;}
  .namewrap input:focus{border-color:var(--accent);}
  .rmbtns{display:flex;gap:10px;margin-top:14px;}.rmbtns .btn{margin-top:0;}
  .namewarn{margin-top:8px;color:#e03131;font-weight:800;font-size:13.5px;text-align:center;}.namewarn.hidden{display:none;}
  .tmodal{position:fixed;inset:0;z-index:2000;background:rgba(20,25,30,.55);display:flex;align-items:center;justify-content:center;padding:20px;}
  .tmodal.hidden{display:none;}
  .tbox{background:var(--paper);border-radius:20px;padding:26px 22px;max-width:420px;width:100%;box-shadow:var(--shadow);position:relative;max-height:85vh;overflow:auto;}
  .tclose{position:absolute;top:12px;right:14px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--gray);}
  .t-title{text-align:center;font-size:21px;font-weight:900;color:var(--head);}
  .t-sub{text-align:center;color:var(--gray);font-size:14px;margin-top:4px;}
  .t-row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-top:10px;}
  .t-row .r-emoji{font-size:22px;}.t-row .r-name{font-weight:800;color:var(--head);flex:1;}
  .t-row .r-score{font-weight:800;color:var(--accent);white-space:nowrap;}
  .t-row.undone{opacity:.55;}.t-row .r-todo{color:var(--gray);font-size:13px;font-weight:700;}
  .t-total{text-align:center;margin-top:18px;font-size:27px;font-weight:900;color:var(--head);}
  .t-grade{text-align:center;margin-top:6px;font-size:18px;font-weight:800;color:var(--accent);}
  .t-note{text-align:center;margin-top:10px;font-size:14px;color:var(--gray);word-break:keep-all;line-height:1.6;}
  .btn.alt2{background:linear-gradient(135deg,#2f9e44,#2b8a3e);}
  .btn.small{max-width:280px;margin:12px auto 0;padding:11px;font-size:14px;}
  .vrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 13px;margin-top:9px;}
  .vrow.me{border-color:var(--accent);}
  .vno{font-weight:900;font-size:15px;color:var(--gray);width:28px;text-align:center;flex:none;}
  .vname{font-weight:800;color:var(--head);flex:1;word-break:break-all;}
  .vscore{font-weight:800;color:var(--accent);white-space:nowrap;}
  .vmeta{font-size:12px;color:var(--gray);white-space:nowrap;}
  .bwrite{margin:14px 0;}
  .bwrite input,.bwrite textarea{width:100%;padding:11px 13px;font-size:14.5px;border:2px solid var(--line);border-radius:11px;font-family:inherit;background:var(--paper);color:var(--ink);outline:none;margin-bottom:9px;}
  :root[data-theme="dark"] .bwrite input,:root[data-theme="dark"] .bwrite textarea,:root[data-theme="dark"] .resetin{background:#1b212a;}
  .bwrite textarea{min-height:70px;resize:vertical;}
  .bwrite input:focus,.bwrite textarea:focus{border-color:var(--accent);}
  .bcount{font-size:13px;font-weight:700;color:var(--accent2);margin:6px 0 10px;}
  .bpost{border:1px solid var(--line);border-left:5px solid var(--accent2);border-radius:12px;padding:11px 13px;margin-bottom:9px;}
  .bhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px;}
  .bname{font-weight:800;color:var(--head);font-size:14px;}
  .btext{font-size:14px;color:var(--ink);line-height:1.6;word-break:keep-all;white-space:pre-wrap;}
  .blike{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:800;color:var(--gray);cursor:pointer;font-family:inherit;display:flex;gap:4px;align-items:center;}
  .blike.liked{color:#e03131;border-color:#f6c6c2;background:#fdecea;cursor:default;}
  .resetin{width:100%;margin-top:12px;padding:11px 13px;font-size:15px;text-align:center;border:2px solid var(--line);border-radius:11px;font-family:inherit;background:var(--paper);color:var(--ink);outline:none;}
  .teamwrap{margin-top:10px;font-weight:700;font-size:14px;color:var(--head);display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap;}
  .teamwrap select{padding:8px 12px;font-size:14px;font-family:inherit;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);outline:none;cursor:pointer;font-weight:700;}
  :root[data-theme="dark"] .teamwrap select{background:#1b212a;}
  .teamwrap select:focus{border-color:var(--accent);}
  .dash-row{display:flex;gap:10px;margin:14px 0;}
  .dash-stat{flex:1;background:var(--soft,rgba(0,0,0,.04));border:1px solid var(--line);border-radius:14px;padding:14px 6px;text-align:center;}
  .dash-stat .ds-v{font-weight:900;font-size:22px;color:var(--accent);}
  .dash-stat .ds-l{font-size:12px;color:var(--gray);margin-top:3px;}
  .dash-sec{font-weight:800;color:var(--head);font-size:15px;margin:16px 0 10px;}
</style>

<button id="themeBtn" class="theme-btn" title="다크모드 전환">🌙</button>

<div class="wrap">
  <header>
    <div class="flags">🍊🌊🌾🏞️⛰️</div>
    <h1>우리나라 방언 퀴즈</h1>
    <p>선생님이 학급 방을 만들어 공유하면, 학생들이 여러 지역 방언을 함께 풀고 랭킹·게시판을 나눌 수 있어요.</p>
  </header>

  <div id="roomArea"></div>

  <div class="sec-title" id="gridTitle">지역을 골라 풀어 보세요</div>
  <div class="grid" id="regionGrid"></div>

  <!-- 방 만들기 화면 -->
  <div id="createScreen" class="card hidden">
    <div class="sec-title">🏫 학급 방 만들기</div>
    <div id="createForm">
      <div class="field"><label for="roomName">학급 이름</label><input id="roomName" type="text" placeholder="예) 5학년 1반" maxlength="30" autocomplete="off"></div>
      <div class="field"><label for="roomPw">비밀번호 <span class="tag">(선생님 관리용 · 점수 초기화에 필요)</span></label><input id="roomPw" type="text" placeholder="기억하기 쉬운 비밀번호" maxlength="30" autocomplete="off"></div>
      <div class="status" id="createStatus"></div>
      <button class="btn" id="doCreate">방 만들기</button>
      <button class="btn ghost" id="cancelCreate">← 돌아가기</button>
    </div>
    <div id="createResult" class="hidden"></div>
  </div>

  <footer>방언 표현은 지역·세대에 따라 다를 수 있어요. 재미있게 즐겨 주세요! 🙂</footer>
</div>

<div id="totalModal" class="tmodal hidden"><div class="tbox"><button class="tclose" id="totalClose" aria-label="닫기">✕</button><div id="totalBody"></div></div></div>
<div id="viewModal" class="tmodal hidden"><div class="tbox"><button class="tclose" id="viewClose" aria-label="닫기">✕</button><div id="viewBody"></div></div></div>
<div id="resetHubModal" class="tmodal hidden"><div class="tbox" style="max-width:360px"><button class="tclose" id="resetHubClose" aria-label="닫기">✕</button>
  <div class="t-title">🧹 전체 초기화</div>
  <div class="t-note">이 방의 <b>모든 점수·소감·기록</b>이 삭제됩니다.<br>선생님 비밀번호를 입력하세요.</div>
  <input id="resetHubPw" type="text" class="resetin" placeholder="방 비밀번호" autocomplete="off">
  <div class="status" id="resetHubStatus"></div>
  <div class="rmbtns" style="margin-top:14px"><button class="btn ghost" id="resetHubCancel">취소</button><button class="btn" id="resetHubGo">초기화</button></div>
</div></div>

<script>
const SUPABASE_URL = "https://zxdxdqsutsvnbplqaefx.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp4ZHhkcXN1dHN2bmJwbHFhZWZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NjQyMTQsImV4cCI6MjEwMTU0MDIxNH0.Xv5l9F8696UYIxmcNltJwDtz_VS9aBp2hYfEvhjl33U";
const HDRJ = { apikey:SUPABASE_ANON_KEY, Authorization:"Bearer "+SUPABASE_ANON_KEY, "Content-Type":"application/json" };
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function rpc(fn,p){ return fetch(SUPABASE_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:HDRJ,body:JSON.stringify(p)}).then(r=>r.ok?r.json():Promise.reject(r.status)); }

const REGIONS = [
  { name:"제주", emoji:"🍊", c:"#f4712e", file:"jeju.html", desc:"하르방·혼저·지슬·올레·오름…" },
  { name:"경상도", emoji:"🌊", c:"#e03131", file:"gyeongsang.html", desc:"정구지·단디·억수로·개안타…" },
  { name:"전라도", emoji:"🌾", c:"#2f9e44", file:"jeolla.html", desc:"거시기·시방·겁나게·짠하다…" },
  { name:"충청도", emoji:"🏞️", c:"#3b5bdb", file:"chungcheong.html", desc:"겨·워디·을매·지둘러…" },
  { name:"강원도", emoji:"⛰️", c:"#099268", file:"gangwon.html", desc:"마카·욥시기·감재·새첩다…" }
];

/* ---- 방 상태 (URL ?room + localStorage) ---- */
let currentRoom = null;
(function(){
  let code=null; try{ code=new URLSearchParams(location.search).get("room"); }catch(e){}
  if(!code){ try{ code=localStorage.getItem("krRoomCode"); }catch(e){} }
  if(code){ code=code.toUpperCase(); let nm=code; try{ const s=JSON.parse(localStorage.getItem("krRoom")||"null"); if(s&&s.code===code) nm=s.name; }catch(e){} currentRoom={code,name:nm}; try{localStorage.setItem("krRoomCode",code);}catch(e){} }
})();
function roomQS(){ return currentRoom ? ("?room="+encodeURIComponent(currentRoom.code)) : ""; }
function getMyName(){ try{ return localStorage.getItem("krName")||""; }catch(e){ return ""; } }
function setMyName(v){ try{ if(v){ localStorage.setItem("krName",v); } }catch(e){} }
const REGION_ORDER=[{n:"제주",e:"🍊"},{n:"경상도",e:"🌊"},{n:"전라도",e:"🌾"},{n:"충청도",e:"🏞️"},{n:"강원도",e:"⛰️"}];
function showTotal(){
  const name=getMyName();
  if(!name){ document.getElementById("myName").focus(); document.getElementById("myName").style.borderColor="#e03131"; return; }
  const body=document.getElementById("totalBody"); body.innerHTML='<div class="t-sub">⏳ 불러오는 중…</div>';
  document.getElementById("totalModal").classList.remove("hidden");
  fetch(SUPABASE_URL+"/rest/v1/scores_kr?room=eq."+encodeURIComponent(currentRoom.code)+"&name=eq."+encodeURIComponent(name)+"&select=region,score,pct",{headers:{apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+SUPABASE_ANON_KEY}})
    .then(r=>r.json()).then(rows=>renderTotal(rows,name)).catch(function(e){ body.innerHTML='<div class="t-sub">⚠️ 불러오지 못했어요.</div>'; });
}
function renderTotal(rows,name){
  const map={}; (rows||[]).forEach(function(r){ map[r.region]=r; });
  let total=0,done=0,pctSum=0;
  const list=REGION_ORDER.map(function(reg){
    const r=map[reg.n];
    if(r){ done++; total+=r.score; pctSum+=r.pct; return '<div class="t-row"><span class="r-emoji">'+reg.e+'</span><span class="r-name">'+reg.n+'</span><span class="r-score">🏆 '+r.score+' · '+r.pct+'%</span></div>'; }
    return '<div class="t-row undone"><span class="r-emoji">'+reg.e+'</span><span class="r-name">'+reg.n+'</span><span class="r-todo">아직 안 풂</span></div>';
  }).join("");
  const avg=done?Math.round(pctSum/done):0;
  let grade;
  if(done===5){ if(avg>=90)grade="🏆 방언 박사님!"; else if(avg>=75)grade="🌟 방언 고수!"; else if(avg>=60)grade="👍 훌륭해요!"; else if(avg>=40)grade="🙂 잘했어요!"; else grade="💪 더 도전해봐요!"; }
  else grade="아직 "+(5-done)+"개 지역이 남았어요!";
  const note=done===5?("5개 지역 모두 완료! 평균 정확도 "+avg+"%"):(done+"/5 지역 완료 · 남은 지역을 마저 풀어 총점을 채워 보세요!");
  document.getElementById("totalBody").innerHTML='<div class="t-title">🏅 '+esc(name)+' 님의 종합 결과</div><div class="t-sub">'+esc(currentRoom.name)+' 방</div>'+list+'<div class="t-total">총점 🏆 '+total+'점</div><div class="t-grade">'+grade+'</div><div class="t-note">'+note+'</div>';
}

function H(){ return {apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+SUPABASE_ANON_KEY}; }
function HJ2(){ return {apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+SUPABASE_ANON_KEY,"Content-Type":"application/json"}; }
function openView(){ document.getElementById("viewModal").classList.remove("hidden"); }

/* 학급 전체 랭킹 (5개 지역 합산) */
function showClassRank(){
  openView(); document.getElementById("viewBody").innerHTML='<div class="t-sub">⏳ 불러오는 중…</div>';
  fetch(SUPABASE_URL+"/rest/v1/scores_kr?room=eq."+encodeURIComponent(currentRoom.code)+"&select=name,score",{headers:H()})
    .then(function(r){ return r.json(); }).then(function(rows){
      var m={}; (rows||[]).forEach(function(x){ if(!m[x.name]) m[x.name]={total:0,regions:0}; m[x.name].total+=x.score; m[x.name].regions++; });
      var arr=Object.keys(m).map(function(n){ return {name:n,total:m[n].total,regions:m[n].regions}; }).sort(function(a,b){ return b.total-a.total; });
      var me=getMyName();
      var list=arr.length? arr.map(function(p,i){ var rank=i+1; var medal=rank===1?"🥇":rank===2?"🥈":rank===3?"🥉":rank; var mine=(p.name===me&&me); return '<div class="vrow'+(mine?' me':'')+'"><span class="vno">'+medal+'</span><span class="vname">'+esc(p.name)+(mine?' (나)':'')+'</span><span class="vscore">🏆 '+p.total+'</span><span class="vmeta">'+p.regions+'/5</span></div>'; }).join("") : '<div class="t-sub">아직 등록된 점수가 없어요.</div>';
      document.getElementById("viewBody").innerHTML='<div class="t-title">🏆 학급 전체 랭킹</div><div class="t-sub">'+esc(currentRoom.name)+' 방 · 5개 지역 점수 합산</div>'+list;
    }).catch(function(){ document.getElementById("viewBody").innerHTML='<div class="t-sub">⚠️ 불러오지 못했어요.</div>'; });
}

/* 모둠(팀) 대항전 */
function getTeam(){ try{ return localStorage.getItem("krTeam")||""; }catch(e){ return ""; } }
function setTeam(v){ try{ localStorage.setItem("krTeam",v||""); }catch(e){} }
var _teamSyncTimer=null;
function syncTeam(){ var nm=getMyName(); if(!currentRoom||!nm) return; clearTimeout(_teamSyncTimer); _teamSyncTimer=setTimeout(function(){ fetch(SUPABASE_URL+"/rest/v1/rpc/set_team_kr",{method:"POST",headers:HJ2(),body:JSON.stringify({p_room:currentRoom.code,p_name:nm,p_team:getTeam()})}).catch(function(){}); }, 700); }
function showTeamRank(){
  openView(); document.getElementById("viewBody").innerHTML='<div class="t-sub">⏳ 불러오는 중…</div>';
  Promise.all([
    fetch(SUPABASE_URL+"/rest/v1/scores_kr?room=eq."+encodeURIComponent(currentRoom.code)+"&select=name,score",{headers:H()}).then(function(r){return r.json();}),
    fetch(SUPABASE_URL+"/rest/v1/team_kr?room=eq."+encodeURIComponent(currentRoom.code)+"&select=name,team",{headers:H()}).then(function(r){return r.json();})
  ]).then(function(res){
    var scores=Array.isArray(res[0])?res[0]:[], teams=Array.isArray(res[1])?res[1]:[];
    var teamOf={}; teams.forEach(function(t){ if(t.team) teamOf[t.name]=t.team; });
    var agg={}, members={};
    scores.forEach(function(s){ var tm=teamOf[s.name]; if(!tm) return; agg[tm]=(agg[tm]||0)+s.score; (members[tm]=members[tm]||{})[s.name]=1; });
    var arr=Object.keys(agg).map(function(t){ return {team:t,total:agg[t],n:Object.keys(members[t]).length}; }).sort(function(a,b){ return b.total-a.total; });
    var myTeam=getTeam();
    var list=arr.length? arr.map(function(p,i){ var rank=i+1; var medal=rank===1?"🥇":rank===2?"🥈":rank===3?"🥉":rank; var mine=(p.team===myTeam&&myTeam); return '<div class="vrow'+(mine?' me':'')+'"><span class="vno">'+medal+'</span><span class="vname">'+esc(p.team)+(mine?' (우리 모둠)':'')+'</span><span class="vscore">🏆 '+p.total+'</span><span class="vmeta">'+p.n+'명</span></div>'; }).join("") : '<div class="t-sub">아직 모둠 점수가 없어요. 입장할 때 모둠을 고르고 퀴즈를 풀어 보세요!</div>';
    document.getElementById("viewBody").innerHTML='<div class="t-title">👥 모둠 대항 랭킹</div><div class="t-sub">'+esc(currentRoom.name)+' 방 · 모둠별 점수 합산</div>'+list;
  }).catch(function(){ document.getElementById("viewBody").innerHTML='<div class="t-sub">⚠️ 불러오지 못했어요.</div>'; });
}

/* 선생님 대시보드 */
function showDashboard(){
  openView(); document.getElementById("viewBody").innerHTML='<div class="t-sub">⏳ 불러오는 중…</div>';
  fetch(SUPABASE_URL+"/rest/v1/scores_kr?room=eq."+encodeURIComponent(currentRoom.code)+"&select=name,region,pct",{headers:H()})
    .then(function(r){ return r.json(); }).then(function(rows){
      rows=rows||[];
      var names={}, byRegion={}, pctSum=0;
      var REG=["제주","경상도","전라도","충청도","강원도"];
      REG.forEach(function(r){ byRegion[r]={n:0,pct:0}; });
      rows.forEach(function(x){ names[x.name]=(names[x.name]||0)+1; if(byRegion[x.region]){ byRegion[x.region].n++; byRegion[x.region].pct+=x.pct; } pctSum+=x.pct; });
      var students=Object.keys(names).length;
      var avg=rows.length? Math.round(pctSum/rows.length):0;
      var finishers=Object.keys(names).filter(function(n){ return names[n]>=5; }).length;
      var regRows=REG.map(function(r){ var b=byRegion[r]; var ap=b.n? Math.round(b.pct/b.n):0; return '<div class="vrow"><span class="vname">'+r+'</span><span class="vmeta">참여 '+b.n+'명</span><span class="vscore">평균 '+ap+'%</span></div>'; }).join("");
      document.getElementById("viewBody").innerHTML='<div class="t-title">📊 선생님 대시보드</div><div class="t-sub">'+esc(currentRoom.name)+' 방 현황</div>'+
        '<div class="dash-row"><div class="dash-stat"><div class="ds-v">'+students+'</div><div class="ds-l">참여 학생</div></div><div class="dash-stat"><div class="ds-v">'+avg+'%</div><div class="ds-l">평균 정확도</div></div><div class="dash-stat"><div class="ds-v">'+finishers+'</div><div class="ds-l">5지역 완주</div></div></div>'+
        '<div class="dash-sec">지역별 참여 현황</div>'+regRows;
    }).catch(function(){ document.getElementById("viewBody").innerHTML='<div class="t-sub">⚠️ 불러오지 못했어요.</div>'; });
}

/* 우리 반 소감 (전체) */
function showBoard(){
  openView();
  document.getElementById("viewBody").innerHTML='<div class="t-title">📝 우리 반 소감</div><div class="t-sub">'+esc(currentRoom.name)+' 방 · 방언 퀴즈 소감</div>'+
    '<div class="bwrite"><input id="bName" type="text" placeholder="이름(실명)" maxlength="20" value="'+esc(getMyName())+'"><textarea id="bText" placeholder="방언 퀴즈를 풀어본 소감을 남겨 주세요." maxlength="300"></textarea><div class="status" id="bStatus"></div><button class="btn" id="bSubmit">소감 올리기</button></div><div id="bList"></div>';
  document.getElementById("bSubmit").onclick=submitBoard;
  loadBoard();
}
function loadBoard(){
  var list=document.getElementById("bList"); list.innerHTML='<div class="t-sub">⏳ 불러오는 중…</div>';
  fetch(SUPABASE_URL+"/rest/v1/reflections_kr?room=eq."+encodeURIComponent(currentRoom.code)+"&region=eq."+encodeURIComponent("전체")+"&select=id,name,text,likes&order=created_at.desc&limit=300",{headers:H()})
    .then(function(r){ return r.json(); }).then(function(rows){
      if(!rows||!rows.length){ list.innerHTML='<div class="t-sub">아직 소감이 없어요. 첫 소감을 남겨보세요! 🙂</div>'; return; }
      list.innerHTML='<div class="bcount">총 '+rows.length+'개</div>'+rows.map(function(r){ var liked=isLiked(r.id); return '<div class="bpost"><div class="bhead"><span class="bname">🙋 '+esc(r.name)+'</span><button class="blike '+(liked?'liked':'')+'" '+(liked?'disabled':'')+' data-id="'+r.id+'">❤️ <span>'+(r.likes||0)+'</span></button></div><div class="btext">'+esc(r.text)+'</div></div>'; }).join("");
      Array.prototype.forEach.call(list.querySelectorAll(".blike"),function(b){ b.onclick=function(){ likeBoard(+b.getAttribute("data-id"),b); }; });
    }).catch(function(){ list.innerHTML='<div class="t-sub">⚠️ 불러오지 못했어요.</div>'; });
}
function submitBoard(){
  var name=document.getElementById("bName").value.trim(), text=document.getElementById("bText").value.trim(), st=document.getElementById("bStatus");
  if(!name){ st.textContent="이름을 입력해 주세요."; return; }
  if(!text){ st.textContent="내용을 입력해 주세요."; return; }
  st.textContent="⏳ 올리는 중…";
  fetch(SUPABASE_URL+"/rest/v1/reflections_kr",{method:"POST",headers:HJ2(),body:JSON.stringify({room:currentRoom.code,region:"전체",name:name,text:text})})
    .then(function(r){ if(r.ok){ setMyName(name); document.getElementById("bText").value=""; st.textContent="✅ 소감을 올렸어요!"; loadBoard(); } else st.textContent="⚠️ 실패 — 다시 시도해 주세요."; })
    .catch(function(){ st.textContent="⚠️ 실패 — 인터넷을 확인해 주세요."; });
}
function isLiked(id){ try{ return JSON.parse(localStorage.getItem("krLikes")||"[]").indexOf(id)>=0; }catch(e){ return false; } }
function addLiked(id){ try{ var a=JSON.parse(localStorage.getItem("krLikes")||"[]"); if(a.indexOf(id)<0){ a.push(id); localStorage.setItem("krLikes",JSON.stringify(a)); } }catch(e){} }
function likeBoard(id,btn){ if(isLiked(id)) return; addLiked(id); if(btn){ btn.disabled=true; btn.classList.add("liked"); } fetch(SUPABASE_URL+"/rest/v1/rpc/like_reflection_kr",{method:"POST",headers:HJ2(),body:JSON.stringify({p_id:id})}).then(function(r){ return r.json(); }).then(function(n){ if(btn&&typeof n==="number"){ var s=btn.querySelector("span"); if(s) s.textContent=n; } }).catch(function(){}); }

    $("myName").addEventListener("input",function(){ setMyName(this.value.trim()); this.style.borderColor=""; var w=$("nameWarn"); if(w) w.classList.add("hidden"); syncTeam(); });
    $("totalBtn").onclick=showTotal;
    $("classRankBtn").onclick=showClassRank;
    $("teamRankBtn").onclick=showTeamRank;
    $("dashBtn").onclick=showDashboard;
    $("boardBtn").onclick=showBoard;

    var ts=$("teamSel"); if(ts){ ts.value=getTeam(); ts.onchange=function(){ setTeam(this.value); syncTeam(); }; }
    $("gridTitle").textContent="지역을 골라 우리 반과 함께 풀어 보세요";
  } else {

    $("openCreate").onclick=openCreate;

function leaveRoom(){ currentRoom=null; try{ localStorage.removeItem("krRoomCode"); localStorage.removeItem("krRoom"); }catch(e){} try{ history.replaceState(null,"",location.pathname); }catch(e){} renderRoomArea(); renderRegions(); }

/* ---- 방 만들기 ---- */
let createdRoom=null, lastQr="";
function openCreate(){ ensureBgm(); createdRoom=null; $("roomName").value=""; $("roomPw").value=""; $("createStatus").textContent=""; $("createForm").classList.remove("hidden"); $("createResult").classList.add("hidden"); $("createResult").innerHTML=""; $("createScreen").classList.remove("hidden"); $("createScreen").scrollIntoView({behavior:"smooth"}); }
function cancelCreate(){ stopBgm(); $("createScreen").classList.add("hidden"); }
async function doCreate(){
  ensureBgm();
  const name=$("roomName").value.trim(), pw=$("roomPw").value.trim();
  if(!name||!pw){ setCS("학급 이름과 비밀번호를 모두 입력하세요.","warn"); return; }
  setCS("⏳ 방 만드는 중…","");
  try{ const code=await rpc("create_room_kr",{p_name:name,p_password:pw}); createdRoom={code:String(code).toUpperCase(),name}; showCreated(); }
  catch(e){ setCS("⚠️ 방 만들기 실패 — 인터넷/설정을 확인하세요.","warn"); }
}
function setCS(m,k){ const el=$("createStatus"); el.textContent=m; el.className="status "+(k||""); }
function roomLink(code){ return location.origin+location.pathname+"?room="+encodeURIComponent(code); }
function showCreated(){
  const link=roomLink(createdRoom.code);
  lastQr="https://api.qrserver.com/v1/create-qr-code/?size=440x440&margin=12&data="+encodeURIComponent(link);
  $("createForm").classList.add("hidden");
  $("createResult").classList.remove("hidden");
  $("createResult").innerHTML=
    '<div class="made">✅ <b>'+esc(createdRoom.name)+'</b> 방이 만들어졌어요!</div>'+
    '<div class="code-big">'+esc(createdRoom.code)+'</div>'+
    '<img class="qr" src="'+lastQr+'" alt="방 입장 QR">'+
    '<button class="btn ghost" id="dlQr">📥 QR 이미지 저장</button>'+
    '<div class="linkbox" style="margin-top:12px"><input id="linkInput" type="text" readonly value="'+esc(link)+'"><button class="btn ghost" id="copyLink">복사</button></div>'+
    '<div class="status" id="shareHint">이 링크나 QR을 학생들에게 공유하세요. 비밀번호는 점수 초기화 때 필요하니 기억해 두세요.</div>'+
    '<button class="btn ghost" id="bgmBtn" style="margin-top:14px">🔇 배경음악 끄기</button>'+
    '<button class="btn" id="enterRoom" style="margin-top:10px">이 방으로 입장</button>';
  $("dlQr").onclick=downloadQr; $("copyLink").onclick=copyLink; $("bgmBtn").onclick=toggleBgm; $("enterRoom").onclick=enterCreated;
  startBgm();
}
async function downloadQr(){
  const fn="방언퀴즈_"+(createdRoom?createdRoom.code:"방")+"_QR.png";
  try{ const b=await (await fetch(lastQr)).blob(); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=fn; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000); $("shareHint").textContent="✅ QR 이미지를 저장했어요!"; }
  catch(e){ window.open(lastQr,"_blank"); $("shareHint").textContent="QR을 새 탭에서 열었어요. 이미지를 저장하세요."; }
}
async function copyLink(){ try{ await navigator.clipboard.writeText($("linkInput").value); $("shareHint").textContent="✅ 링크를 복사했어요!"; }catch(e){ $("linkInput").select(); } }
function enterCreated(){ stopBgm(); currentRoom=createdRoom; try{ localStorage.setItem("krRoomCode",currentRoom.code); localStorage.setItem("krRoom",JSON.stringify(currentRoom)); history.replaceState(null,"",roomLink(currentRoom.code)); }catch(e){} $("createScreen").classList.add("hidden"); renderRoomArea(); renderRegions(); window.scrollTo({top:0,behavior:"smooth"}); }

/* ---- 배경음악(합성 루프) ---- */
let bgmCtx=null,bgmGain=null,bgmTimer=null,bgmOn=false;
function ensureBgm(){ try{ bgmCtx=bgmCtx||new (window.AudioContext||window.webkitAudioContext)(); if(bgmCtx.state==="suspended") bgmCtx.resume(); }catch(e){} }
function bgmNote(f,at,d,ty,v){ const o=bgmCtx.createOscillator(),g=bgmCtx.createGain(); o.type=ty||"square"; o.frequency.value=f; g.gain.setValueAtTime(0.0001,at); g.gain.exponentialRampToValueAtTime(v||0.4,at+0.02); g.gain.exponentialRampToValueAtTime(0.0001,at+d); o.connect(g); g.connect(bgmGain); o.start(at); o.stop(at+d+0.03); }
function scheduleBgm(){ if(!bgmOn||!bgmCtx) return; const bars=[{b:130.81,a:[261.63,329.63,392.00,523.25]},{b:98,a:[196,246.94,293.66,392]},{b:110,a:[220,261.63,329.63,440]},{b:87.31,a:[174.61,220,261.63,349.23]}]; const step=0.16, now=bgmCtx.currentTime+0.05; bars.forEach((bar,bi)=>{ const t0=bi*4*step; bgmNote(bar.b,now+t0,0.55,"triangle",0.5); bar.a.forEach((f,ai)=>bgmNote(f,now+t0+ai*step,0.14,"square",0.32)); }); bgmTimer=setTimeout(scheduleBgm,bars.length*4*step*1000); }
function startBgm(){ if(bgmOn) return; ensureBgm(); if(!bgmCtx) return; if(!bgmGain){ bgmGain=bgmCtx.createGain(); bgmGain.connect(bgmCtx.destination); } bgmGain.gain.cancelScheduledValues(bgmCtx.currentTime); bgmGain.gain.setValueAtTime(0.12,bgmCtx.currentTime); bgmOn=true; scheduleBgm(); updBgm(); }
function stopBgm(){ bgmOn=false; if(bgmTimer){ clearTimeout(bgmTimer); bgmTimer=null; } if(bgmGain&&bgmCtx){ try{ bgmGain.gain.setTargetAtTime(0.0001,bgmCtx.currentTime,0.12); }catch(e){} } updBgm(); }
function toggleBgm(){ bgmOn?stopBgm():startBgm(); }
function updBgm(){ const b=$("bgmBtn"); if(b) b.textContent=bgmOn?"🔇 배경음악 끄기":"🎵 배경음악 켜기"; }

$("themeBtn").onclick=()=>applyTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");

document.getElementById("viewClose").onclick=function(){ document.getElementById("viewModal").classList.add("hidden"); };

document.getElementById("resetHubGo").onclick=doResetAll;
document.getElementById("resetHubModal").addEventListener("click",function(e){ if(e.target.id==="resetHubModal") this.classList.add("hidden"); });
(function init(){
  let th="light"; try{ th=localStorage.getItem("dialectTheme")||"light"; }catch(e){}
  applyTheme(th);
  renderRoomArea(); renderRegions();
  // 방 이름 확인(링크로 들어온 경우)
  if(currentRoom){ rpc("get_room_kr",{p_code:currentRoom.code}).then(name=>{ if(name){ currentRoom.name=name; try{localStorage.setItem("krRoom",JSON.stringify(currentRoom));}catch(e){} renderRoomArea(); renderRegions(); } else { leaveRoom(); } }).catch(()=>{}); }
})();
</script>
