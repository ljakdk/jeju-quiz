<title>경상도 방언 퀴즈</title>
<link rel="stylesheet" href="dialect-style.css">
<style>:root{--accent:#e03131;--accent-d:#c92a2a;--accent2:#f08c00;--bg1:#ffe3e3;--bg2:#ffe8cc;}</style>
<div id="app"></div>
<script>
window.QUIZ = {
  region: "경상도",
  emoji: "🌊",
  questions: [
    { dialogue:[["할매","정구지 전 부쳤다, 무라."],["손자","우와, 잘 묵을게예!"]], hl:"정구지", q:"‘정구지’는 무엇일까요?", options:["부추","미나리","쑥","시금치"], answer:0, exp:"‘정구지’는 <b>부추</b>를 뜻하는 경상도 말이에요." },
    { dialogue:[["엄마","학교 갈 때 단디 해라."],["아이","알았다카이."]], hl:"단디", q:"‘단디 해라’에서 ‘단디’는?", options:["야무지게·똑바로","천천히","대충","시끄럽게"], answer:0, exp:"‘단디’는 <b>야무지게·똑바로·조심히</b>라는 뜻이에요." },
    { dialogue:[["친구","오늘 억수로 덥다 그자?"],["나","맞다, 진짜 덥다."]], hl:"억수로", q:"‘억수로’는?", options:["매우·엄청","조금","가끔","전혀"], answer:0, exp:"‘억수로’는 <b>매우·엄청나게</b>라는 뜻이에요." },
    { dialogue:[["A","이거 어예 하노?"],["B","내가 갈차 줄게."]], hl:"어예", q:"‘어예 하노’에서 ‘어예’는?", options:["어떻게","언제","어디서","왜"], answer:0, exp:"‘어예(우예)’는 <b>어떻게</b>예요. ‘갈차 주다’는 ‘가르쳐 주다’." },
    { dialogue:[["동생","성아, 와 그라노?"],["형","아이다, 아무것도."]], hl:"와", q:"‘와 그라노’에서 ‘와’는?", options:["왜","뭐","누가","언제"], answer:0, exp:"‘와’는 <b>왜</b>예요. ‘그라노’는 ‘그러니’." },
    { dialogue:[["A","마이 아프나?"],["B","개안타, 걱정 마라."]], hl:"개안타", q:"‘개안타’는?", options:["괜찮다","아프다","힘들다","싫다"], answer:0, exp:"‘개안타’는 <b>괜찮다</b>는 뜻이에요." },
    { dialogue:[["아지매","저 집 얼라 참 곱네."],["이웃","야무지게 컸지예."]], hl:"얼라", q:"‘얼라’는 누구를 가리킬까요?", options:["아기·어린아이","청년","노인","손님"], answer:0, exp:"‘얼라’는 <b>아기·어린아이</b>를 뜻해요." },
    { dialogue:[["손자","할배, 어디 가노?"],["할배","밭에 간다."]], hl:"할배", q:"‘할배’는?", options:["할아버지","삼촌","이웃","형"], answer:0, exp:"‘할배’는 <b>할아버지</b>, ‘할매’는 할머니예요." },
    { dialogue:[["아이","아재요, 이거 얼만교?"],["주인","천 원이다."]], hl:"아재", q:"‘아재’는?", options:["아저씨","할아버지","형","동생"], answer:0, exp:"‘아재’는 <b>아저씨</b>예요. ‘얼만교’는 ‘얼마예요?’." },
    { dialogue:[["A","그 사람 이름 뭐꼬?"],["B","아이고, 이자뿟다."]], hl:"이자뿟다", q:"‘이자뿟다’는?", options:["잊어버렸다","기억났다","알려줬다","물어봤다"], answer:0, exp:"‘이자뿟다’는 <b>잊어버렸다</b>는 뜻이에요." },
    { dialogue:[["A","그 집 맛 우떻노?"],["B","영 파이다."]], hl:"파이다", q:"‘파이다’는?", options:["별로다·좋지 않다","최고다","맵다","달다"], answer:0, exp:"‘파이다’는 <b>별로다·좋지 않다</b>는 뜻이에요." },
    { dialogue:[["엄마","손 매매 씻어라."],["아이","예!"]], hl:"매매", q:"‘매매 씻어라’에서 ‘매매’는?", options:["세게·박박","살살","빨리","대충"], answer:0, exp:"‘매매’는 <b>세게·단단히·박박</b>이라는 뜻이에요." },
    { dialogue:[["A","맛이 우떻노?"],["B","캬~ 대끼리다!"]], hl:"대끼리", q:"‘대끼리’는?", options:["최고다","별로다","평범하다","이상하다"], answer:0, exp:"‘대끼리’는 <b>최고다·아주 좋다</b>는 뜻이에요." },
    { dialogue:[["엄마","고마 해라, 마이 했다."],["아이","쪼매만 더예."]], hl:"고마", q:"‘고마 해라’에서 ‘고마’는?", options:["그만","더","빨리","같이"], answer:0, exp:"‘고마’는 <b>그만·그냥</b>이에요. ‘쪼매’는 조금." },
    { dialogue:[["엄마","퍼뜩 온나!"],["아이","가요, 가요!"]], hl:"퍼뜩", q:"‘퍼뜩 온나’에서 ‘퍼뜩’은?", options:["빨리","천천히","조용히","몰래"], answer:0, exp:"‘퍼뜩’은 <b>빨리</b>, ‘온나’는 ‘오너라’예요." },
    { dialogue:[["할매","아가, 이리 온나."],["손자","가예!"]], hl:"온나", q:"‘온나’는?", options:["오너라·와","가거라","앉아라","서라"], answer:0, exp:"‘온나’는 <b>오너라·이리 와</b>라는 뜻이에요." },
    { dialogue:[["친구","이거 노나 묵자."],["나","좋다!"]], hl:"노나", q:"‘노나 묵자’에서 ‘노나’는?", options:["나눠","많이","빨리","혼자"], answer:0, exp:"‘노나’는 <b>나눠(서)</b>, ‘묵자’는 ‘먹자’예요." },
    { dialogue:[["A","그 영화 재밌더나?"],["B","짜다리 안 재밌더라."]], hl:"짜다리", q:"‘짜다리’는?", options:["그다지·별로","아주","조금","처음"], answer:0, exp:"‘짜다리’는 <b>그다지·별로</b>라는 뜻이에요." },
    { dialogue:[["아지매","야야, 밥 뭇나?"],["아이","예, 무웃어예."]], hl:"밥 뭇나", q:"‘밥 뭇나’는?", options:["밥 먹었니","밥 하니","어디 가니","뭐 하니"], answer:0, exp:"‘뭇나’는 <b>먹었니</b>, ‘무웃다’는 ‘먹었다’예요." },
    { dialogue:[["A","사람 많더나?"],["B","천지빼까리더라."]], hl:"천지빼까리", q:"‘천지빼까리’는?", options:["매우 많음","조금","전혀 없음","딱 알맞음"], answer:0, exp:"‘천지빼까리’는 <b>아주 많음</b>을 뜻해요." },
    { dialogue:[["아지매","저 머시마 씩씩하네."],["이웃","개구지지예."]], hl:"머시마", q:"‘머시마’는?", options:["남자아이","여자아이","어른","노인"], answer:0, exp:"‘머시마’는 <b>남자아이</b>예요." },
    { dialogue:[["할매","우리 가시나 다 컸네."],["손녀","히히."]], hl:"가시나", q:"‘가시나’는?", options:["여자아이","남자아이","새댁","손님"], answer:0, exp:"‘가시나’는 <b>여자아이</b>를 뜻하는 말이에요." },
    { dialogue:[["아재","오늘 쎄빠지게 일했다."],["이웃","고생했네예."]], hl:"쎄빠지게", q:"‘쎄빠지게’는?", options:["몹시 힘들게","즐겁게","편하게","빠르게"], answer:0, exp:"‘쎄빠지게’는 <b>몹시 힘들게·고생스럽게</b>라는 뜻이에요." },
    { dialogue:[["엄마","다라이에 물 좀 받아라."],["아이","예."]], hl:"다라이", q:"‘다라이’는?", options:["대야","바가지","항아리","냄비"], answer:0, exp:"‘다라이’는 <b>대야(큰 그릇)</b>를 뜻해요." },
    { dialogue:[["할배","밤에 야시가 내려온다."],["손자","무섭다!"]], hl:"야시", q:"‘야시’는 어떤 동물일까요?", options:["여우","너구리","토끼","고양이"], answer:0, exp:"‘야시’는 <b>여우</b>예요." },
    { dialogue:[["친구","니 와 삐졌노?"],["나","안 삐졌다."]], hl:"삐지다", q:"‘삐지다’는?", options:["토라지다","넘어지다","놀라다","다치다"], answer:0, exp:"‘삐지다(삐치다)’는 <b>토라지다</b>는 뜻이에요." },
    { dialogue:[["엄마","때 좀 문때라."],["아이","박박 밀게예."]], hl:"문때다", q:"‘문때다’는?", options:["문지르다","헹구다","말리다","담그다"], answer:0, exp:"‘문때다’는 <b>문지르다</b>는 뜻이에요." },
    { dialogue:[["엄마","언능 자라, 늦었다."],["아이","예, 잘게예."]], hl:"언능", q:"‘언능’은?", options:["얼른","천천히","조용히","일찍"], answer:0, exp:"‘언능’은 <b>얼른·빨리</b>라는 뜻이에요." },
    { dialogue:[["A","이제 우얄래?"],["B","우야든지 해봐야지."]], hl:"우얄래", q:"‘우얄래’는?", options:["어쩔래·어떡할래","어디 갈래","뭐 할래","언제 할래"], answer:0, exp:"‘우얄래’는 <b>어쩔래·어떡할래</b>예요." },
    { dialogue:[["손님","쪼매만 깎아 주이소."],["주인","그라입시더."]], hl:"쪼매", q:"‘쪼매’는?", options:["조금","많이","전부","빨리"], answer:0, exp:"‘쪼매’는 <b>조금</b>이에요. ‘그라입시더’는 ‘그럽시다’." }
  ]
};
</script>
