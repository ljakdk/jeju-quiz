<title>제주 방언 퀴즈 (우리나라 방언)</title>
<link rel="stylesheet" href="dialect-style.css">
<style>:root{--accent:#f4712e;--accent-d:#e35e1c;--accent2:#2a9d8f;--bg1:#ffe8cc;--bg2:#d7f0ec;}</style>
<div id="app"></div>
<script>
window.QUIZ = {
  region: "제주",
  emoji: "🍊",
  questions: [
    { dialogue:[["손지","하르방, 어디 감수과?"],["하르방","밧디 감쪄."]], hl:"하르방", q:"‘하르방’은?", options:["할아버지","아저씨","이웃","손님"], answer:0, exp:"‘하르방’은 <b>할아버지</b>예요. 할머니는 ‘할망’." },
    { dialogue:[["아이","할망, 밥 주세요."],["할망","오냐, 이레 온나."]], hl:"할망", q:"‘할망’은?", options:["할머니","이모","누나","손님"], answer:0, exp:"‘할망’은 <b>할머니</b>예요." },
    { dialogue:[["할망","혼저 옵서예!"],["손님","예, 왔수다."]], hl:"혼저", q:"‘혼저’는?", options:["어서·빨리","혼자","조용히","천천히"], answer:0, exp:"‘혼저’는 <b>어서·빨리</b>. ‘혼저 옵서예’는 ‘어서 오세요’." },
    { dialogue:[["손님","고맙습니다."],["할망","폭삭 속았수다~"]], hl:"폭삭 속았수다", q:"‘폭삭 속았수다’는?", options:["정말 수고하셨습니다","깜빡 속았어요","반가워요","많이 드세요"], answer:0, exp:"‘폭삭 속았수다’는 ‘<b>정말 수고하셨습니다</b>’예요." },
    { dialogue:[["아이","저기 강생이 봐!"],["어멍","요망지다."]], hl:"강생이", q:"‘강생이’는?", options:["강아지","고양이","송아지","병아리"], answer:0, exp:"‘강생이’는 <b>강아지</b>예요." },
    { dialogue:[["삼춘","오늘 도새기 궈 먹게."],["조캐","좋수다!"]], hl:"도새기", q:"‘도새기’는?", options:["돼지","닭","말","염소"], answer:0, exp:"‘도새기’는 <b>돼지</b>예요. 제주 흑돼지가 유명하죠." },
    { dialogue:[["어멍","지슬 삶아둠서 먹으라."],["아이","고맙수다."]], hl:"지슬", q:"‘지슬’은?", options:["감자","고구마","옥수수","밤"], answer:0, exp:"‘지슬’은 <b>감자</b>예요. (‘감저’는 고구마)" },
    { dialogue:[["할망","감저 쪄시난 먹으라."],["아이","고맙수다!"]], hl:"감저", q:"‘감저’는?", options:["고구마","감자","호박","옥수수"], answer:0, exp:"제주에서 ‘감저’는 <b>고구마</b>예요. (‘지슬’이 감자)" },
    { dialogue:[["아이","어멍 어디 이수과?"],["어멍","정지에 이시메."]], hl:"정지", q:"‘정지’는?", options:["부엌","마당","화장실","다락"], answer:0, exp:"‘정지’는 <b>부엌</b>이에요." },
    { dialogue:[["관광객","이 골목 예뻐요."],["삼춘","이게 올레우다."]], hl:"올레", q:"‘올레’는?", options:["집으로 드는 좁은 골목","절벽","산봉우리","광장"], answer:0, exp:"‘올레’는 <b>집 마당으로 드는 좁은 골목</b>이에요." },
    { dialogue:[["아이","저 오름 올라가게!"],["아방","강 보게."]], hl:"오름", q:"‘오름’은?", options:["작은 화산 언덕","동굴","밭","연못"], answer:0, exp:"‘오름’은 <b>작은 화산체 언덕</b>이에요. 제주에 360여 개." },
    { dialogue:[["행인","무사 마씀?"],["관광객","길 좀 여쭐게요."]], hl:"무사", q:"‘무사’는?", options:["왜","언제","어떻게","누구"], answer:0, exp:"‘무사’는 <b>왜</b>예요." },
    { dialogue:[["아이","아방 어디 가수과?"],["어멍","바당에 갓져."]], hl:"바당", q:"‘바당’은?", options:["바다","산","들판","강"], answer:0, exp:"‘바당’은 <b>바다</b>예요." },
    { dialogue:[["할망","빙떡에 촘지름 발라."],["손님","고소해요."]], hl:"촘지름", q:"‘촘지름’은?", options:["참기름","간장","식초","꿀"], answer:0, exp:"‘촘지름’은 <b>참기름</b>이에요." },
    { dialogue:[["엄마","아기 곱들락허게 생겼다."],["이웃","게메."]], hl:"곱들락", q:"‘곱들락하다’는?", options:["곱고 예쁘다","우습다","건강하다","조용하다"], answer:0, exp:"‘곱들락하다’는 <b>곱고 예쁘다</b>는 뜻이에요." },
    { dialogue:[["손님","이 국 베지근허네요."],["할망","잘 끓였주."]], hl:"베지근", q:"‘베지근하다’는?", options:["진하고 구수하다","맵다","싱겁다","시다"], answer:0, exp:"‘베지근하다’는 국물이 <b>진하고 구수하다</b>는 뜻이에요." },
    { dialogue:[["할망","저 밧디 놈삐 하영 컸져."],["삼춘","풍년이우다."]], hl:"놈삐", q:"‘놈삐’는?", options:["무","배추","당근","파"], answer:0, exp:"‘놈삐’는 <b>무</b>예요. ‘하영’은 ‘많이’." },
    { dialogue:[["할망","밥 몬딱 먹어시냐?"],["아이","예, 몬딱 먹언마씀!"]], hl:"몬딱", q:"‘몬딱’은?", options:["모두·전부","조금","천천히","벌써"], answer:0, exp:"‘몬딱’은 <b>모두·전부</b>예요." },
    { dialogue:[["아이","시험 걱정돼."],["어멍","조들지 말라."]], hl:"조들다", q:"‘조들지 말라’에서 ‘조들다’는?", options:["걱정하다","서두르다","다투다","졸다"], answer:0, exp:"‘조들다’는 <b>걱정하다</b>는 뜻이에요." },
    { dialogue:[["관광객","저 둥근 건 뭐우꽈?"],["해녀","테왁이라, 몸 의지허는 거."]], hl:"테왁", q:"‘테왁’은?", options:["해녀의 부력 도구","그물","잠수복","작살"], answer:0, exp:"‘테왁’은 <b>해녀가 물질하며 몸을 기대는 부력 도구</b>예요." },
    { dialogue:[["어멍","구덕에 담앙 오라."],["아이","예!"]], hl:"구덕", q:"‘구덕’은?", options:["대나무 바구니","항아리","지게","돗자리"], answer:0, exp:"‘구덕’은 <b>대나무로 짠 바구니</b>예요." },
    { dialogue:[["어멍","마농 다져 놩 먹으라."],["아이","맛있수다."]], hl:"마농", q:"‘마농’은?", options:["마늘","생강","양파","고추"], answer:0, exp:"‘마농’은 <b>마늘</b>이에요." },
    { dialogue:[["아이","이 가루 뭐우꽈?"],["할망","개역이여."]], hl:"개역", q:"‘개역’은?", options:["미숫가루","밀가루","설탕","소금"], answer:0, exp:"‘개역’은 <b>보리 등을 볶아 빻은 미숫가루</b>예요." },
    { dialogue:[["하르방","촐 비어 와사켜."],["손지","도울쿠다."]], hl:"촐", q:"‘촐’은?", options:["마소에게 먹이는 꼴","땔감","거름","볍씨"], answer:0, exp:"‘촐’은 <b>소·말에게 먹이는 꼴(풀)</b>이에요." },
    { dialogue:[["관광객","통시가 있었다면서요?"],["삼춘","돗 키우던 뒷간이라."]], hl:"통시", q:"‘통시’는?", options:["돼지 치던 재래식 뒷간","부엌","곳간","외양간"], answer:0, exp:"‘통시’는 <b>돼지우리와 겸했던 제주 재래식 뒷간</b>이에요." },
    { dialogue:[["삼춘","폭낭 아래서 만나게."],["아이","그 큰 나무요?"]], hl:"폭낭", q:"‘폭낭’은?", options:["팽나무","소나무","감나무","대나무"], answer:0, exp:"‘폭낭’은 <b>팽나무</b>예요. 마을 정자나무." },
    { dialogue:[["관광객","하얀 풀이 가득해요."],["삼춘","어욱이우다."]], hl:"어욱", q:"‘어욱’은?", options:["억새","갈대","벼","잔디"], answer:0, exp:"‘어욱’은 <b>억새</b>예요." },
    { dialogue:[["삼춘","우리 각시 손맛이 좋수다."],["손님","부럽수다!"]], hl:"각시", q:"‘각시’는?", options:["아내","딸","이모","손녀"], answer:0, exp:"‘각시’는 <b>아내</b>예요." },
    { dialogue:[["어멍","질 미끄러우난 멩심허라."],["아이","예!"]], hl:"멩심", q:"‘멩심하다’는?", options:["조심하다","서두르다","뛰다","노래하다"], answer:0, exp:"‘멩심하다’는 <b>조심하다</b>는 뜻이에요." },
    { dialogue:[["친구","소풍 가게!"],["나","어드레 감수과?"]], hl:"어드레", q:"‘어드레’는?", options:["어디로","어째서","언제쯤","얼마나"], answer:0, exp:"‘어드레’는 <b>어디로</b>예요." }
  ]
};
</script>
