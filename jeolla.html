<title>전라도 방언 퀴즈</title>

<script>
window.QUIZ = {
  region: "전라도",
  emoji: "🌾",
  questions: [
    { dialogue:[["A","거시기 좀 갖다 줘라."],["B","거시기가 뭐당가?"]], hl:"거시기", q:"‘거시기’는 주로 어떤 말일까요?", options:["얼른 생각나지 않는 것을 대신 이르는 말","특정 음식 이름","특정 사람 이름","작별 인사"], answer:0, exp:"‘거시기’는 <b>말이 얼른 생각나지 않을 때 그것을 대신 이르는 말</b>이에요. 전라도에서 두루 쓰여요." },
    { dialogue:[["A","시방 어디여?"],["B","집이여."]], hl:"시방", q:"‘시방’은?", options:["지금","아까","나중","가끔"], answer:0, exp:"‘시방’은 <b>지금</b>이라는 뜻이에요." },
    { dialogue:[["친구","오늘 겁나게 춥다."],["나","그러게, 손 시려."]], hl:"겁나게", q:"‘겁나게’는?", options:["매우·엄청","무섭게","조금","가끔"], answer:0, exp:"‘겁나게’는 <b>매우·엄청나게</b>라는 뜻이에요." },
    { dialogue:[["아재","아따, 날이 좋구만!"],["이웃","그라제라."]], hl:"아따", q:"‘아따’는 어떤 말일까요?", options:["감탄하며 강조할 때 내는 말","숫자 여덟","작별 인사","질문하는 말"], answer:0, exp:"‘아따’는 <b>감탄하거나 강조할 때 내는 말</b>이에요." },
    { dialogue:[["할매","워메, 이게 누구여!"],["손자","할매, 저 왔어라."]], hl:"워메", q:"‘워메’는?", options:["놀라며 내는 감탄사","배고픔","화남","졸림"], answer:0, exp:"‘워메(오메)’는 <b>놀라거나 감탄할 때 내는 말</b>이에요." },
    { dialogue:[["친구","우리 항꾼에 가자."],["나","좋제!"]], hl:"항꾼에", q:"‘항꾼에’는?", options:["함께·한꺼번에","혼자","천천히","나중에"], answer:0, exp:"‘항꾼에(한꾼에)’는 <b>함께·한꺼번에</b>라는 뜻이에요." },
    { dialogue:[["엄마","밥 폴새 다 됐다."],["아이","잘 먹을게라."]], hl:"폴새", q:"‘폴새’는?", options:["벌써","아직","방금","곧"], answer:0, exp:"‘폴새’는 <b>벌써</b>라는 뜻이에요." },
    { dialogue:[["A","무슨 야그 하고 있냐?"],["B","별거 아녀."]], hl:"야그", q:"‘야그’는?", options:["이야기","약","야채","약속"], answer:0, exp:"‘야그’는 <b>이야기</b>를 뜻해요." },
    { dialogue:[["A","진짜여?"],["B","근당께, 내 말 믿어."]], hl:"근당께", q:"‘근당께’는?", options:["그렇다니까","아니라니까","모른다니까","싫다니까"], answer:0, exp:"‘근당께’는 <b>그렇다니까</b>라는 뜻이에요." },
    { dialogue:[["엄마","무담시 그러지 말어."],["아이","알았어라."]], hl:"무담시", q:"‘무담시’는?", options:["공연히·괜히","일부러","급하게","조용히"], answer:0, exp:"‘무담시(무담씨)’는 <b>공연히·괜히</b>라는 뜻이에요." },
    { dialogue:[["할매","저 어린것이 짠하다."],["이웃","그러게라."]], hl:"짠하다", q:"‘짠하다’는?", options:["안쓰럽다·애처롭다","짜다(맛)","즐겁다","귀찮다"], answer:0, exp:"‘짠하다’는 <b>안쓰럽고 애처롭다</b>는 뜻이에요." },
    { dialogue:[["손님","이 국 참 개미지네요."],["주인","많이 드셔라."]], hl:"개미지다", q:"‘개미지다’는 어떤 맛일까요?", options:["깊고 감칠맛이 난다","맵고 얼큰하다","싱겁다","달다"], answer:0, exp:"‘개미지다(게미지다)’는 음식이 <b>깊고 감칠맛이 난다</b>는 전라도 표현이에요." },
    { dialogue:[["A","사람 많더냐?"],["B","솔찬히 많더라."]], hl:"솔찬히", q:"‘솔찬히’는?", options:["상당히·꽤","조금","전혀","가끔"], answer:0, exp:"‘솔찬히’는 <b>상당히·꽤 많이</b>라는 뜻이에요." },
    { dialogue:[["할매","이리 잔 와 봐라."],["손자","예, 가요."]], hl:"잔", q:"‘이리 잔 와 봐라’에서 ‘잔’은?", options:["좀(조금)","잔뜩","빨리","혼자"], answer:0, exp:"‘잔’은 <b>좀(조금)</b>이라는 뜻으로 부탁할 때 써요." },
    { dialogue:[["손님","쪼까만 주세요."],["주인","그려라."]], hl:"쪼까", q:"‘쪼까’는?", options:["조금","많이","전부","빨리"], answer:0, exp:"‘쪼까(쪼깨)’는 <b>조금</b>이에요." },
    { dialogue:[["친구","이번 여행 오졌다!"],["나","완전 좋았어."]], hl:"오지", q:"‘오지다’는?", options:["아주 좋다·만족스럽다","힘들다","아쉽다","평범하다"], answer:0, exp:"‘오지다’는 <b>아주 좋고 만족스럽다</b>는 뜻이에요." },
    { dialogue:[["엄마","후딱 씻고 자라."],["아이","예."]], hl:"후딱", q:"‘후딱’은?", options:["빨리·얼른","천천히","조용히","살짝"], answer:0, exp:"‘후딱’은 <b>빨리·얼른</b>이라는 뜻이에요." },
    { dialogue:[["할배","나락이 노랗게 익었네."],["손자","가을이네요."]], hl:"나락", q:"‘나락’은?", options:["벼","보리","콩","수수"], answer:0, exp:"‘나락’은 <b>벼</b>를 뜻해요." },
    { dialogue:[["A","빙판에 자빠질 뻔했어."],["B","조심해라."]], hl:"자빠", q:"‘자빠지다’는?", options:["넘어지다","일어나다","앉다","달리다"], answer:0, exp:"‘자빠지다’는 <b>넘어지다</b>는 뜻이에요." },
    { dialogue:[["A","참말로 고맙네."],["B","별말씀을요."]], hl:"참말로", q:"‘참말로’는?", options:["정말로","거짓말로","조용히","가끔"], answer:0, exp:"‘참말로’는 <b>정말로</b>라는 뜻이에요." },
    { dialogue:[["할매","이녁은 어찌 생각하요?"],["할배","글쎄."]], hl:"이녁", q:"‘이녁’은 누구를 가리킬까요?", options:["당신·자기(상대방)","이웃","자식","손님"], answer:0, exp:"‘이녁’은 <b>당신·자기(상대방)</b>를 정답게 이르는 말이에요." },
    { dialogue:[["A","비 오는디 어쩌쓰까?"],["B","우산 갖고 가."]], hl:"어쩌쓰까", q:"‘어쩌쓰까’는?", options:["어떡할까","어디 갈까","언제 갈까","누구일까"], answer:0, exp:"‘어쩌쓰까’는 <b>어떡할까</b>라는 뜻이에요." },
    { dialogue:[["할배","시한에는 방이 최고여."],["손자","따뜻해요."]], hl:"시한", q:"‘시한’은 어느 계절일까요?", options:["겨울","여름","봄","가을"], answer:0, exp:"‘시한’은 <b>겨울</b>을 뜻하는 말이에요." },
    { dialogue:[["동생","형아 그거 냅둬."],["형","알았어."]], hl:"냅둬", q:"‘냅둬’는?", options:["놔둬·내버려 둬","가져가","치워","이리 줘"], answer:0, exp:"‘냅둬’는 <b>놔둬·내버려 둬</b>라는 뜻이에요." },
    { dialogue:[["엄마","배깥이 춥다, 옷 입어라."],["아이","예."]], hl:"배깥", q:"‘배깥’은?", options:["바깥","부엌","마당","방 안"], answer:0, exp:"‘배깥(배꼍)’은 <b>바깥</b>을 뜻해요." },
    { dialogue:[["아짐","아그들아, 밥 먹어라."],["아이들","예!"]], hl:"아그", q:"‘아그’는?", options:["아이","어른","노인","손님"], answer:0, exp:"‘아그’는 <b>아이</b>를 뜻해요. ‘아짐’은 아주머니." },
    { dialogue:[["동생","성, 같이 가!"],["형","빨리 와."]], hl:"성", q:"‘성’은 누구를 부르는 말일까요?", options:["형·오빠","동생","삼촌","친구"], answer:0, exp:"‘성’은 <b>형·오빠</b>를 부르는 말이에요." },
    { dialogue:[["A","이만하면 되았다."],["B","그래, 충분해."]], hl:"되았다", q:"‘되았다’는?", options:["됐다·다 되었다","안 된다","모른다","힘들다"], answer:0, exp:"‘되았다’는 <b>됐다·다 되었다</b>는 뜻이에요." },
    { dialogue:[["A","가고 싶어. 그란디 돈이 없어."],["B","다음에 가자."]], hl:"그란디", q:"‘그란디’는?", options:["그런데","그러니까","그리고","그래서"], answer:0, exp:"‘그란디’는 <b>그런데</b>라는 뜻이에요." },
    { dialogue:[["상인","이거 싸게 폴게라."],["손님","고마워요."]], hl:"폴", q:"‘폴다’는?", options:["팔다","사다","주다","바꾸다"], answer:0, exp:"‘폴다’는 <b>팔다</b>라는 뜻이에요." }
  ]
};
</script>
